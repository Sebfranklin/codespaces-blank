<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gospel App — Waitlist</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            black: '#050505',
            white: '#FAFAF7',
            gold: {
              primary: '#D4AF37',
              light: '#F5D76E',
              dark: '#B8860B',
            }
          }
        }
      }
    }
  </script>
  <!-- Custom Styles -->
  <link rel="stylesheet" href="styles.css">
  <!-- Zdog CDN -->
  <script src="https://unpkg.com/zdog@1/dist/zdog.dist.min.js"></script>
  <!-- Vanilla-Tilt CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="overflow-x-hidden selection:bg-gold-primary selection:text-black">
  <main id="app-container">
    <!-- Section 1: Hero -->
    <section id="hero-section" class="relative min-h-[100dvh] flex flex-col justify-between py-12 px-6 max-w-7xl mx-auto">
      <!-- Header -->
      <header class="flex justify-between items-center w-full">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-full border-2 border-gold-primary flex items-center justify-center">
            <i data-lucide="cross" class="w-4 h-4 text-gold-primary"></i>
          </div>
          <span class="font-display font-bold text-xl tracking-wider text-white">GOSPEL</span>
        </div>
        <span class="text-sm font-semibold tracking-widest text-gold-primary bg-gold-primary/10 px-3 py-1.5 rounded-full border border-gold-primary/30">DECEMBER 2026</span>
      </header>

      <!-- Content / Zdog Area -->
      <div class="flex flex-col lg:flex-row items-center justify-between gap-12 my-auto w-full">
        <!-- Feature description block -->
        <div class="w-full lg:w-1/2 flex flex-col items-start text-left order-2 lg:order-1">
          <h1 class="font-display font-extrabold text-4xl sm:text-6xl tracking-tight leading-tight text-white mb-6">
            One Body.<br/>
            <span class="gold-text-gradient">Unified Destiny.</span>
          </h1>
          <div class="min-h-[160px] flex flex-col justify-start">
            <h3 id="feature-title" class="font-display font-bold text-2xl text-gold-light mb-2">A United Body</h3>
            <p id="feature-desc" class="text-zinc-400 text-lg leading-relaxed max-w-[45ch]">
              Connecting believers across every nation, tribe, and denomination into one platform. Built on love, not division.
            </p>
          </div>
          <div class="flex gap-4 mt-6">
            <button id="prev-btn" class="w-12 h-12 rounded-full border border-zinc-800 hover:border-gold-primary/50 flex items-center justify-center text-zinc-400 hover:text-white transition-all">
              <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </button>
            <button id="next-btn" class="w-12 h-12 rounded-full border border-zinc-800 hover:border-gold-primary/50 flex items-center justify-center text-zinc-400 hover:text-white transition-all">
              <i data-lucide="arrow-right" class="w-5 h-5"></i>
            </button>
          </div>
        </div>

        <!-- Canvas container -->
        <div class="w-full lg:w-1/2 flex justify-center order-1 lg:order-2">
          <div class="relative w-[320px] h-[320px] sm:w-[450px] sm:h-[450px] bg-zinc-950/20 rounded-full border border-zinc-900/50 flex items-center justify-center">
            <canvas id="zdog-canvas" width="450" height="450" class="cursor-grab active:cursor-grabbing max-w-full"></canvas>
            <div class="absolute bottom-4 text-xs text-zinc-600 font-mono tracking-widest pointer-events-none">DRAG OR USE ARROWS TO SELECT</div>
          </div>
        </div>
      </div>
    </section>
  </main>
  
  <script src="app.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
