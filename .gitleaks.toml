# Gitleaks config — extends the default ruleset.
#
# Supabase publishes two kinds of key:
#   sb_publishable_* / anon      -> PUBLIC BY DESIGN. Shipped in browser bundles
#                                   on purpose; access is governed by RLS and by
#                                   each edge function's verify_jwt setting.
#   sb_secret_* / service_role   -> real credentials, still scanned.
#
# The waitlist dashboard must embed the publishable key to call the edge
# functions, so it is allowlisted here. Secret/service-role keys are NOT.
[extend]
useDefault = true

[[allowlists]]
description = "Supabase publishable (anon) keys are public by design"
regexTarget = "match"
regexes = [
  '''sb_publishable_[A-Za-z0-9_\-]{16,}''',
]

# ---------------------------------------------------------------------------
# Confirmed false positives (triaged 2026-09-29 with a full workspace scan).
# Every entry below was inspected by hand and is NOT a credential. Each one is
# scoped to the exact benign shape so the rule still catches lookalikes.
# ---------------------------------------------------------------------------

[[allowlists]]
description = "PostHog project keys (phc_) are client-side ingest keys, public by design"
regexTarget = "match"
regexes = [
  '''phc_[A-Za-z0-9]{20,}''',
]

[[allowlists]]
description = "star-history.com chart badges carry a public sealed_token in third-party READMEs"
regexTarget = "match"
regexes = [
  '''sealed_token=[A-Za-z0-9_\-]{16,}''',
]

[[allowlists]]
description = "Third-party doc/model identifiers, e.g. 'API: whisper-large-v3' (a model name, not a key)"
regexTarget = "match"
regexes = [
  '''whisper-large-v3''',
]
